<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocuSign Embedded Sender Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
    aside { padding: 16px; border-right: 1px solid #ddd; overflow: auto; box-sizing: border-box; }
    main { display: flex; }
    iframe { flex: 1; border: 0; width: 100%; height: 100%; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { margin-top: 14px; padding: 8px 12px; width: 100%; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { background: #f5f5f5; padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <aside>
    <h3>1. Create draft envelope</h3>
    <form id="envForm">
      <label>Document (PDF)
        <input type="file" id="file" accept="application/pdf" required />
      </label>
      <label>Signer name
        <input id="signerName" value="Test Signer" required />
      </label>
      <label>Signer email
        <input id="signerEmail" type="email" required />
      </label>
      <label>Email subject
        <input id="emailSubject" value="Please review and sign" />
      </label>
      <button type="submit">Create envelope &amp; open sender view</button>
    </form>

    <h3>2. Status</h3>
    <button id="refreshBtn" disabled>Refresh envelope status</button>
    <button id="closeBtn" disabled>Close sender view</button>

    <h3>Log</h3>
    <pre id="log"></pre>
  </aside>

  <main>
    <iframe id="senderFrame" title="DocuSign Embedded Sender"
            allow="clipboard-read; clipboard-write"></iframe>
  </main>

  <script src="app.js"></script>
</body>
</html>
